<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi dô đi đo, i sô i sô, cù sí</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: { 
                        primary: '#1e1b4b', // Deep indigo
                        secondary: '#312e81', 
                        accent: '#f59e0b', // Amber
                        blueAccent: '#3b82f6', 
                        lightBg: '#f8fafc', 
                        cardBg: '#ffffff' 
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'spin-slow': 'spin 8s linear infinite',
                        'bounce-slight': 'bounceSlight 2s infinite ease-in-out'
                    },
                    keyframes: { 
                        fadeIn: { 
                            '0%': { opacity: '0', transform: 'translateY(15px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        }
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                        normal: '0',
                        wide: '0.02em',
                        wider: '0.05em',
                        widest: '0.1em',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; 
            color: #0f172a; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Scrollbar for a premium look */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Toast Notifications */
        .toast { 
            position: fixed; bottom: 24px; right: 24px; 
            padding: 16px 24px; border-radius: 16px; 
            color: white; font-weight: 700; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            display: flex; align-items: center; gap: 12px; 
            z-index: 1000; 
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .toast.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .toast.fadeOut { animation: fadeOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Typography refinements */
        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }
        
        .tracking-widest {
            letter-spacing: 0.1em;
        }

        /* Banner effects */
        .bg-banner { position: relative; overflow: hidden; }
        .bg-banner::before { 
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); 
            animation: spin 40s linear infinite; pointer-events: none; 
        }
        
        /* Glassmorphism utilities */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Print adjustments */
        @media print {
            body * { visibility: hidden; }
            #report-container, #report-container * { visibility: visible; }
            #report-container { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
            .print\:hidden { display: none !important; }
        }
    </style>
</head>

<body>
    <!-- App Mount Points -->
    <div id="app" class="flex h-screen w-full bg-slate-100"></div>
    <div id="toast-container"></div>
    <div id="timer-drawer-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.initCloud = async function() {
            document.getElementById('app').innerHTML = `
                <div class="flex h-full w-full flex-col items-center justify-center gap-6 bg-slate-50">
                    <div class="relative w-20 h-20">
                        <div class="absolute inset-0 border-4 border-blue-200 rounded-full"></div>
                        <div class="absolute inset-0 border-4 border-blueAccent border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <div class="text-xl font-bold text-slate-700 animate-pulse tracking-wide">Đang tải hệ thống...</div>
                </div>`;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'chuyen-tau-12a1-v2';
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try { firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config; } catch (e) {}
                }
                
                if (!firebaseConfig) {
                    window.useCloud = false; if(window.startApp) window.startApp(); return;
                }
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app); const db = getFirestore(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                
                window.cloudUser = auth.currentUser; window.cloudDb = db; window.cloudAppId = appId; 
                window.cloudDoc = doc; window.cloudSetDoc = setDoc; window.cloudOnSnapshot = onSnapshot; 
                window.useCloud = true;
                if(window.startApp) window.startApp();
            } catch (e) {
                console.warn("Cloud Sync not available, falling back to LocalStorage."); 
                window.useCloud = false; if(window.startApp) window.startApp();
            }
        };
        setTimeout(() => window.initCloud(), 50);
    </script>

    <script>
        let state = {
            currentTab: 'tong-quan',
            theme: { month: "CHỦ ĐIỂM THÁNG", title: "CHUYẾN TÀU THANH XUÂN", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" },
            admin: { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP 12A1", classAvatarUrl: "" },
            settings: { sidebarPosition: 'left', deductStarsOnRedeem: true },
            students: [],
            groups: [
                { id: "g1", name: "Tổ 1", color: "text-red-500", avatarUrl: "" },
                { id: "g2", name: "Tổ 2", color: "text-green-500", avatarUrl: "" },
                { id: "g3", name: "Tổ 3", color: "text-yellow-500", avatarUrl: "" },
                { id: "g4", name: "Tổ 4", color: "text-blueAccent", avatarUrl: "" }
            ],
            rewards: [],
            attendanceRecords: {},
            attendanceTab: 'diem-danh',
            selectedStudentForPoints: null,
            selectedStudentForRewards: null,
            editingStudentId: null,
            editingGroupId: null,
            criteria: null
        };

        let timerInterval = null;
        let timerSeconds = 0;
        let isTimerRunning = false;
        let isDataLoaded = false;

        const menuItems = [
            { id: 'tong-quan', icon: 'ph-squares-four', label: 'Tổng quan' },
            { id: 'hoc-sinh', icon: 'ph-users', label: 'Học sinh' },
            { id: 'tich-diem', icon: 'ph-star', label: 'Tích điểm' },
            { id: 'doi-qua', icon: 'ph-gift', label: 'Quà tặng' },
            { id: 'nhom-thi-dua', icon: 'ph-flag-pennant', label: 'Tổ thi đua' },
            { id: 'diem-danh', icon: 'ph-calendar-check', label: 'Điểm danh' },
            { id: 'vong-quay', icon: 'ph-magic-wand', label: 'Vòng quay' },
            { id: 'dong-ho', icon: 'ph-timer', label: 'Công cụ' },
            { id: 'xep-hang', icon: 'ph-trophy', label: 'Tuyên Dương' },
            { id: 'bao-cao', icon: 'ph-chart-bar', label: 'Sổ theo dõi' },
            { id: 'cai-dat', icon: 'ph-gear', label: 'Cài đặt' }
        ];

        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }
        
        function generateUniqueCode() {
            let code, attempts = 0;
            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (state.students.some(s => s.code === code) && attempts < 100);
            return code;
        }

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.startApp = function() {
            if (window.useCloud && window.cloudDb && window.cloudUser) {
                const docRef = window.cloudDoc(window.cloudDb, 'artifacts', window.cloudAppId, 'users', window.cloudUser.uid, 'classData', 'main');
                window.cloudOnSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const parsed = docSnap.data().state;
                        state = { ...state, ...parsed };
                        applyStateDefaults();
                        if (!isDataLoaded) { isDataLoaded = true; renderLayout(); showToast("Đã đồng bộ Dữ liệu Đám mây!", "success"); } else { renderLayout(); }
                    } else {
                        fallbackLoad(true);
                    }
                }, (error) => { fallbackLoad(); });
            } else { fallbackLoad(); }
        }

        function fallbackLoad(isFirstCloudSync = false) {
            try {
                const savedData = localStorage.getItem('chuyen_tau_data');
                if (savedData) { state = { ...state, ...JSON.parse(savedData) }; applyStateDefaults(); } 
                else { initDefaultStudents(); applyStateDefaults(); saveData(); }
            } catch (err) { initDefaultStudents(); applyStateDefaults(); saveData(); }
            isDataLoaded = true; 
            renderLayout();
            if(isFirstCloudSync) { saveData(); showToast("Đã thiết lập Đám mây!", "success"); }
        }

        async function saveData() { 
            if (window.useCloud && window.cloudDb && window.cloudUser) {
                try {
                    const docRef = window.cloudDoc(window.cloudDb, 'artifacts', window.cloudAppId, 'users', window.cloudUser.uid, 'classData', 'main');
                    await window.cloudSetDoc(docRef, { state: state });
                } catch (e) { localStorage.setItem('chuyen_tau_data', JSON.stringify(state)); }
            } else { localStorage.setItem('chuyen_tau_data', JSON.stringify(state)); }
        }

        function applyStateDefaults() {
            if (!state.theme) state.theme = { month: "CHỦ ĐIỂM THÁNG 9", title: "CHÀO MỪNG NĂM HỌC MỚI", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" };
            if (!state.theme.bannerColorClass) state.theme.bannerColorClass = "from-[#1e1b4b] to-[#312e81]";
            if (!state.admin) state.admin = { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP 12A1", classAvatarUrl: "" };
            if (!state.settings) state.settings = { sidebarPosition: 'left', deductStarsOnRedeem: true };
            if (!state.attendanceRecords) state.attendanceRecords = {};
            if (!state.attendanceTab) state.attendanceTab = 'diem-danh';
            
            const defaultRewards = [
                { id: 'r1', name: 'Đổi chỗ ngồi 1 ngày', cost: 10, icon: 'ph-seat', color: 'text-purple-600', bg: 'bg-purple-100', desc: 'Chọn chỗ ngồi yêu thích' },
                { id: 'r2', name: 'Nhạc theo yêu cầu', cost: 20, icon: 'ph-music-notes', color: 'text-blueAccent', bg: 'bg-blue-100', desc: 'Bật bài hát yêu thích giờ ra chơi' },
                { id: 'r3', name: 'Miễn làm bài tập', cost: 50, icon: 'ph-files', color: 'text-emerald-600', bg: 'bg-emerald-100', desc: 'Miễn 1 bài tập về nhà' },
                { id: 'r4', name: 'Quà tặng bí mật', cost: 100, icon: 'ph-gift', color: 'text-orange-600', bg: 'bg-orange-100', desc: 'Nhận phần quà đặc biệt từ GV' }
            ];
            if (!state.rewards || state.rewards.length === 0) state.rewards = defaultRewards;

            state.students.forEach(s => { 
                if (typeof s.stars === 'undefined') s.stars = s.points; 
                if (!s.code) s.code = generateUniqueCode();
                if (!s.history) s.history = []; // Khởi tạo mảng lịch sử nếu chưa có
            });

            const defaultCriteria = {
                version: 2,
                positive: [{ points: 5, reason: "Phát biểu xây dựng bài" }, { points: 5, reason: "Giúp đỡ bạn bè" }, { points: 10, reason: "Làm bài tập đầy đủ" }, { points: 10, reason: "Phong trào tích cực" }, { points: 15, reason: "Điểm cao trong bài kiểm tra" }, { points: 20, reason: "Đột phá tuần" }],
                negative: [{ points: -5, reason: "Nói chuyện riêng" }, { points: -10, reason: "Không làm bài tập" }, { points: -5, reason: "Quên đồ dùng học tập" }, { points: -5, reason: "Ăn vặt trong lớp" }, { points: -5, reason: "Đi học muộn" }]
            };
            if (!state.criteria || state.criteria.version !== 2) state.criteria = defaultCriteria;
        }

        function initDefaultStudents() {
            state.students = [
                { id: 1, name: "Nguyễn Văn A", points: 85, stars: 85, group: "Tổ 1", role: "Lớp trưởng", goal: "Học sinh giỏi", talent: "Toán", avatarUrl: "", gender: "Nam", code: generateUniqueCode(), history: [] },
                { id: 2, name: "Trần Thị B", points: 60, stars: 60, group: "Tổ 2", role: "Lớp phó", goal: "Học sinh giỏi", talent: "Văn Nghệ", avatarUrl: "", gender: "Nữ", code: generateUniqueCode(), history: [] },
                { id: 3, name: "Lê Hoàng C", points: 45, stars: 45, group: "Tổ 3", role: "Tổ trưởng", goal: "Tiến bộ", talent: "Thể thao", avatarUrl: "", gender: "Nam", code: generateUniqueCode(), history: [] }
            ];
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `<i class="ph-fill ph-check-circle text-2xl drop-shadow"></i> <span>${message}</span>` : `<i class="ph-fill ph-warning-circle text-2xl drop-shadow"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('fadeOut'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function getAvatarImg(url, name, classes = "w-10 h-10") {
            if (url) return `<img src="${url}" class="${classes} rounded-full object-cover shadow-sm border-2 border-white">`;
            const safeName = name || 'User'; const seed = encodeURIComponent(safeName);
            return `<img src="https://api.dicebear.com/7.x/notionists/svg?seed=${seed}&backgroundColor=e0e7ff,fef08a,dcfce7,fee2e2" class="${classes} rounded-full object-cover shadow-sm border-2 border-white">`;
        }

        function switchTab(tabId) { state.currentTab = tabId; renderLayout(); }
        function closeModal(id) { document.getElementById('modal-container').innerHTML = ''; }

        function renderSidebar() {
            const menuHtml = menuItems.map(item => {
                if (item.id === 'dong-ho') {
                    return `<button onclick="openTimerDrawer()" class="w-full flex items-center gap-4 px-6 py-3.5 mb-2 rounded-2xl transition-all duration-300 text-indigo-200 hover:bg-white/10 hover:text-white font-semibold group"><div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/20 transition-colors"><i class="ph-fill ${item.icon} text-xl"></i></div><span class="text-sm tracking-wide">${item.label}</span></button>`;
                }
                const isActive = state.currentTab === item.id;
                return `
                    <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-4 px-6 py-3.5 mb-2 rounded-2xl transition-all duration-300 group relative overflow-hidden ${isActive ? 'text-white' : 'text-indigo-200 hover:text-white hover:bg-white/5'}">
                        ${isActive ? '<div class="absolute inset-0 bg-gradient-to-r from-blueAccent to-indigo-600 opacity-90"></div><div class="absolute inset-0 bg-[url(\'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNykiLz48L3N2Zz4=\')]"></div>' : ''}
                        <div class="relative z-10 flex items-center gap-4 w-full">
                            <div class="p-2 rounded-xl ${isActive ? 'bg-white/20 shadow-inner' : 'bg-transparent group-hover:bg-white/10'} transition-colors"><i class="ph-fill ${item.icon} text-xl"></i></div>
                            <span class="text-sm tracking-wide font-bold">${item.label}</span>
                        </div>
                    </button>`;
            }).join('');

            const classAvatarContent = state.admin.classAvatarUrl ? `<img src="${state.admin.classAvatarUrl}" class="w-full h-full object-cover">` : `<i class="ph-fill ph-student text-white text-3xl"></i>`;

            return `
                <aside class="w-[280px] bg-primary text-white flex flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.05)] z-20 flex-shrink-0 print:hidden relative border-r border-white/10">
                    <div class="flex flex-col items-center justify-center p-8 pb-6 relative overflow-hidden">
                        <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                        <div class="relative group cursor-pointer mb-5 z-10" onclick="document.getElementById('class-avatar-upload').click()" title="Thay đổi ảnh đại diện">
                            <div class="w-20 h-20 bg-gradient-to-tr from-blueAccent to-purple-500 rounded-3xl flex items-center justify-center shadow-lg border-2 border-white/20 transform group-hover:scale-105 transition-all overflow-hidden relative group-hover:shadow-blueAccent/50">
                                ${classAvatarContent}
                                <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-camera text-white text-xl"></i></div>
                            </div>
                        </div>
                        <input type="file" id="class-avatar-upload" class="hidden" accept="image/*" onchange="handleClassAvatarUpload(event)">
                        <div class="font-extrabold text-white text-center text-[15px] tracking-wide uppercase leading-snug drop-shadow-md z-10 px-2">${state.admin.className || "LỚP HỌC"}</div>
                        <div class="text-[10px] text-indigo-300/80 uppercase tracking-widest mt-1.5 z-10 font-bold">Hệ thống quản lý</div>
                    </div>
                    <div class="flex-1 overflow-y-auto px-4 custom-scrollbar pb-6">${menuHtml}</div>
                </aside>
            `;
        }

        function renderHeader() {
            const syncStatus = window.useCloud 
                ? `<div class="hidden sm:flex items-center gap-2 text-[11px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-100 shadow-sm"><i class="ph-fill ph-cloud-check text-sm animate-pulse"></i> Đã đồng bộ Cloud</div>` 
                : `<div class="hidden sm:flex items-center gap-2 text-[11px] font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200"><i class="ph-fill ph-hard-drives text-sm"></i> Lưu cục bộ</div>`;
            
            return `
                <header class="glass sticky top-0 px-6 py-4 flex justify-between items-center z-10 flex-shrink-0 print:hidden shadow-sm">
                    <div class="flex items-center gap-3">
                        <button class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-xl" onclick="alert('Tính năng menu di động đang phát triển')"><i class="ph-bold ph-list text-xl"></i></button>
                        <h2 class="text-xl font-black text-slate-800 tracking-tight hidden md:block capitalize">${menuItems.find(m => m.id === state.currentTab)?.label || 'Bảng điều khiển'}</h2>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <button onclick="openParentLookupModal()" class="flex items-center gap-2 text-xs font-bold text-white bg-gradient-to-r from-orange-400 to-amber-500 px-4 py-2 rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all" title="Cổng Phụ Huynh tra cứu">
                            <i class="ph-bold ph-magnifying-glass text-sm"></i> <span class="hidden sm:inline">Tra cứu</span>
                        </button>
                        ${syncStatus}

        function renderViewTichDiem() {
            const selectedStudentId = state.selectedStudentForPoints || null;
            const student = state.students.find(s => s.id === selectedStudentId);

            let progressHtml = `
                <div class="text-center py-16 text-slate-400 font-medium">
                    <div class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 relative overflow-hidden group border border-slate-100 bg-slate-50 shadow-inner">

            if (student) {
                const maxPoints = 500; const milestones = [100, 300, 500]; const currentPoints = student.points || 0;
                let nextMilestone = milestones.find(m => m > currentPoints) || maxPoints;
                let pointsNeeded = Math.max(0, nextMilestone - currentPoints);
                let progressPercent = Math.min(100, (currentPoints / maxPoints) * 100);

                progressHtml = `
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-12 gap-6 relative z-10">

                                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-orange-50 border border-orange-100 text-xs text-orange-700 font-bold ml-2"><i class="ph-fill ph-target"></i> Cần ${pointsNeeded}đ cho mốc tiếp theo</div>
                            </div>
                        </div>
                        <div class="text-left md:text-right w-full lg:w-auto bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner min-w-[160px]">
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">TỔNG ĐIỂM TÍCH LŨY</div>
                            <div class="text-4xl md:text-5xl font-black text-blueAccent leading-none">${currentPoints}</div>
                        </div>
                    </div>
                    
                    <div class="relative w-full max-w-4xl mx-auto pt-6 pb-4 px-4 z-10">
                        <div class="absolute top-1/2 left-0 w-full h-3.5 bg-slate-100 -translate-y-1/2 rounded-full border border-slate-200/60 shadow-inner"></div>
                        <div class="absolute top-1/2 left-0 h-3.5 bg-gradient-to-r from-blue-400 to-blueAccent -translate-y-1/2 rounded-full transition-all duration-1000 ease-out shadow-[0_0_15px_rgba(59,130,246,0.4)]" style="width: ${progressPercent}%"></div>
                        ${milestones.map(m => {
                            const isReached = currentPoints >= m; const leftPos = (m / maxPoints) * 100;
                            return `
                                <div class="absolute top-1/2 -translate-y-1/2 flex flex-col items-center transform -translate-x-1/2" style="left: ${leftPos}%">
                                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-full border-4 ${isReached ? 'border-blueAccent bg-white text-blueAccent shadow-lg scale-110' : 'border-slate-200 bg-slate-50 text-slate-300'} flex items-center justify-center font-bold text-lg md:text-xl z-10 transition-all duration-500">${isReached ? '<i class="ph-fill ph-star"></i>' : '<i class="ph-fill ph-lock-key"></i>'}</div>
                                    <div class="absolute top-12 md:top-14 text-[10px] md:text-xs font-bold ${isReached ? 'text-blue-700 bg-blue-50 px-2 py-1 rounded-md border border-blue-100' : 'text-slate-400'} shadow-sm">${m}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            const renderCriteriaBtn = (c, i, isPositive) => {
                const colors = isPositive 
                    ? { bg: 'from-emerald-50 to-emerald-100', text: 'text-emerald-600', border: 'border-emerald-200', shadow: 'hover:shadow-emerald-500/20', hover: 'hover:border-emerald-400' }

                const prefix = isPositive ? '+' : '';
                return `
                <div class="relative group h-full">
                    <button onclick="awardPoints(${c.points}, '${escapeInlineJs(c.reason)}')" class="w-full h-full bg-gradient-to-br ${colors.bg} ${colors.hover} border ${colors.border} p-4 md:p-5 rounded-2xl text-center transition-all duration-300 hover:-translate-y-1 ${colors.shadow} shadow-sm flex flex-col items-center justify-center gap-2 overflow-hidden relative">
                        <div class="text-2xl md:text-3xl font-black ${colors.text} drop-shadow-sm">${prefix}${c.points}</div>
                        <div class="text-xs md:text-sm font-bold text-slate-700 line-clamp-2 leading-snug px-1">${c.reason}</div>
                    </button>
                    <button onclick="deleteCriterion('${isPositive ? 'positive' : 'negative'}', ${i})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 opacity-0 group-hover:opacity-100 shadow-md hover:bg-red-600 transition-all z-20"><i class="ph-bold ph-x text-xs"></i></button>
                </div>`;
            };

            const positiveCriteriaHtml = (state.criteria?.positive || []).map((c, i) => renderCriteriaBtn(c, i, true)).join('');
            const negativeCriteriaHtml = (state.criteria?.negative || []).map((c, i) => renderCriteriaBtn(c, i, false)).join('');

            return `
                <div class="max-w-7xl mx-auto space-y-6 animate-fade-in relative pb-12">
                    <canvas id="confetti-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-50"></canvas>
                    
                    <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-sm border border-slate-200 relative overflow-hidden mb-6">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-50 rounded-full blur-3xl -mr-32 -mt-32 z-0"></div>
                        ${progressHtml}
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
                        <div class="xl:col-span-4 flex flex-col gap-6">
                            <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-200 flex-1 flex flex-col">
                                <h3 class="font-black text-slate-800 text-lg flex items-center gap-3 mb-6"><div class="p-2 bg-blue-100 text-blueAccent rounded-xl"><i class="ph-fill ph-user-list text-xl"></i></div> Chọn học sinh</h3>
                                <div class="relative flex-1 flex flex-col">
                                    <select onchange="selectStudentForPoints(parseInt(this.value))" class="w-full px-5 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-base font-bold text-slate-800 focus:outline-none focus:border-blueAccent focus:ring-4 focus:ring-blue-100 transition-all appearance-none cursor-pointer shadow-inner">
                                        <option value="">-- Bấm vào đây để chọn --</option>
                                        ${state.students.map(s => `<option value="${s.id}" ${s.id === selectedStudentId ? 'selected' : ''}>${s.name} - ${s.group} (${s.points}đ)</option>`).join('')}
                                    </select>
                                    <i class="ph-bold ph-caret-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xl"></i>
                                </div>
                            </div>
                        </div>

                        <div class="xl:col-span-8">
                            <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-200 transition-all duration-300 h-full relative ${!student ? 'opacity-60 pointer-events-none' : ''}">
                                ${!student ? '<div class="absolute inset-0 z-50 bg-white/50 backdrop-blur-[2px] rounded-[2rem]"></div>' : ''}
                                
                                <h3 class="font-black text-slate-800 text-lg flex items-center gap-3 mb-6"><div class="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><i class="ph-fill ph-plus-circle text-xl"></i></div> Tích cực</h3>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-10">${positiveCriteriaHtml}</div>

                                <h3 class="font-black text-slate-800 text-lg flex items-center gap-3 mb-6 pt-6 border-t border-slate-100"><div class="p-2 bg-red-100 text-red-500 rounded-xl"><i class="ph-fill ph-minus-circle text-xl"></i></div> Nhắc nhở</h3>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-10">${negativeCriteriaHtml}</div>

                                <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200 flex flex-col sm:flex-row gap-4 items-center mt-6">
                                    <div class="w-full sm:w-32 relative">
                                        <input type="number" id="custom-points-val" placeholder="Số điểm" class="w-full pl-9 pr-4 py-3.5 bg-white border border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:border-blueAccent focus:ring-2 focus:ring-blue-100 shadow-sm transition-all">
                                        <i class="ph-bold ph-hash absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                                    </div>
                                    <div class="flex-1 w-full relative">
                                        <input type="text" id="custom-points-reason" placeholder="Lý do tùy chỉnh..." class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-blueAccent focus:ring-2 focus:ring-blue-100 shadow-sm transition-all">
                                        <i class="ph-bold ph-pencil-simple text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-lg"></i>
                                    </div>
                                    <div class="flex gap-2 w-full sm:w-auto">
                                        <button onclick="awardCustomPoints()" class="flex-1 sm:flex-none px-6 py-3.5 bg-primary text-white font-bold rounded-xl hover:bg-secondary shadow-md transition-colors">Áp dụng</button>
                                        <button onclick="saveNewCriterion()" class="px-4 py-3.5 bg-blue-50 text-blue-700 border border-blue-200 font-bold rounded-xl hover:bg-blue-100 shadow-sm transition-colors" title="Lưu làm tiêu chí mới"><i class="ph-bold ph-floppy-disk text-xl"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectStudentForPoints(id) { state.selectedStudentForPoints = id; renderLayout(); }
        function selectStudentForRewards(id) { state.selectedStudentForRewards = id; renderLayout(); }

        function awardPoints(points, reason) {
            if (!state.selectedStudentForPoints) return;
            const studentIndex = state.students.findIndex(s => s.id === state.selectedStudentForPoints);
            if (studentIndex > -1) {
                const s = state.students[studentIndex];
                s.points = Math.max(0, (s.points || 0) + points);
                s.stars = Math.max(0, (s.stars || 0) + points);
                
                // Ghi lại lịch sử
                if (!s.history) s.history = [];
                s.history.push({
                    id: Date.now(),
                    date: new Date().toISOString(),
                    points: points,
                    reason: reason || (points > 0 ? 'Cộng điểm tùy chỉnh' : 'Trừ điểm tùy chỉnh')
                });

                saveData(); renderLayout();
                showToast(points > 0 ? `Đã cộng ${points} điểm cho ${s.name}` : `Đã trừ ${Math.abs(points)} điểm của ${s.name}`, points > 0 ? "success" : "error");
                if (points > 0) triggerConfetti();
            }
        }
        
        function awardCustomPoints() {
            const val = parseInt(document.getElementById('custom-points-val').value);
            const reason = document.getElementById('custom-points-reason').value || 'Tùy chỉnh';
            if (isNaN(val)) return showToast("Vui lòng nhập số điểm!", "error");
            awardPoints(val, reason); document.getElementById('custom-points-val').value = ''; document.getElementById('custom-points-reason').value = '';
        }
        
        function saveNewCriterion() {
            const val = parseInt(document.getElementById('custom-points-val').value);
            const reason = document.getElementById('custom-points-reason').value.trim();
            if (isNaN(val) || val === 0) return showToast("Vui lòng nhập số điểm hợp lệ!", "error");
            if (!reason) return showToast("Vui lòng nhập lý do tiêu chí!", "error");
            if (val > 0) state.criteria.positive.push({ points: val, reason: reason }); else state.criteria.negative.push({ points: val, reason: reason });
            saveData(); renderLayout(); showToast("Đã lưu tiêu chí mới thành công!");
        }
        
        function deleteCriterion(type, index) {
            if (confirm("Xóa tiêu chí này khỏi danh sách?")) { state.criteria[type].splice(index, 1); saveData(); renderLayout(); showToast("Đã xóa"); }
        }

        function renderViewDoiQua() {
            const selectedStudentId = state.selectedStudentForRewards || null;
            const student = state.students.find(s => s.id === selectedStudentId);
            const sortedStudents = [...state.students].sort((a, b) => (b.stars||0) - (a.stars||0));
            
            const studentListHtml = sortedStudents.map(s => `
                <button onclick="selectStudentForRewards(${s.id})" class="flex-shrink-0 w-32 rounded-2xl flex flex-col items-center justify-center p-4 transition-all duration-300 relative overflow-hidden group ${s.id === selectedStudentId ? 'bg-gradient-to-b from-blue-50 to-white border-2 border-blueAccent shadow-md transform -translate-y-2' : 'border border-slate-200 hover:bg-slate-50 bg-white hover:shadow-sm'}">
                    ${s.id === selectedStudentId ? '<div class="absolute top-0 w-full h-1 bg-blueAccent"></div>' : ''}
                    ${getAvatarImg(s.avatarUrl, s.name, "w-14 h-14 ring-2 ring-slate-100 shadow-sm mb-3 group-hover:scale-110 transition-transform")}
                    <div class="text-sm font-bold text-slate-800 truncate w-full text-center mb-2">${s.name.split(' ').pop()}</div>
                    <div class="text-xs font-black px-3 py-1 rounded-xl bg-orange-50 text-orange-600 border border-orange-100 flex items-center justify-center gap-1.5 w-full"><i class="ph-fill ph-star text-accent"></i> ${s.stars || 0}</div>
                </button>
            `).join('');

            const catalogHtml = (state.rewards || []).map(item => {
                let btnHtml = !student ? `<button class="w-full py-3.5 bg-slate-100 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Chọn học sinh</button>` : 
                              (student.stars || 0) >= item.cost ? `<button onclick="executeRedeem('${student.id}', '${item.id}')" class="w-full py-3.5 bg-primary hover:bg-secondary text-white font-bold rounded-xl text-xs uppercase tracking-wide shadow-md hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><i class="ph-bold ph-hand-coins text-lg"></i> Đổi quà</button>` :
                              `<button class="w-full py-3.5 bg-slate-50 border border-slate-200 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Thiếu ${item.cost - (student.stars||0)} sao</button>`;
                return `
                    <div class="bg-white rounded-[2rem] p-2 shadow-sm hover:shadow-xl transition-all duration-300 group border border-slate-200 relative overflow-hidden flex flex-col h-full hover:-translate-y-2">
                        <div class="absolute top-0 right-0 w-32 h-32 ${item.bg.replace('100', '200')}/40 rounded-bl-full -mr-10 -mt-10 transition-transform duration-500 group-hover:scale-125 z-0"></div>
                        <div class="bg-white rounded-[1.6rem] p-6 md:p-8 flex flex-col h-full relative z-10">
                            <div class="w-16 h-16 ${item.bg} rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-sm border border-white ring-4 ring-slate-50"><i class="ph-fill ${item.icon} text-3xl ${item.color}"></i></div>
                            <h4 class="font-black text-slate-800 text-xl mb-2 leading-tight">${item.name}</h4>
                            ${item.desc ? `<p class="text-sm text-slate-500 mb-8 font-medium line-clamp-2">${item.desc}</p>` : '<div class="h-6 mb-8"></div>'}
                            <div class="mt-auto flex items-end justify-between mb-6 pt-5 border-t border-slate-100 border-dashed">
                                <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">CẦN ĐỂ ĐỔI</span><div class="flex items-center gap-1.5 font-black text-slate-800 text-3xl">${item.cost} <i class="ph-fill ph-star text-accent animate-pulse"></i></div></div>
                            </div>
                            ${btnHtml}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="max-w-7xl mx-auto animate-fade-in space-y-8 pb-12">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><i class="ph-fill ph-storefront text-accent"></i> Cửa Hàng Đổi Quà</h2>
                            <p class="text-slate-500 text-sm font-medium mt-1">Dùng sao tích lũy để đổi lấy những phần thưởng hấp dẫn.</p>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-[#1e1b4b] to-secondary rounded-[2rem] p-6 md:p-8 shadow-xl relative overflow-hidden flex flex-col lg:flex-row gap-8 items-center border border-indigo-900">
                        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')]"></div>
                        <div class="flex-1 w-full bg-white/10 backdrop-blur-md p-6 md:p-8 rounded-[1.5rem] border border-white/20 flex flex-col sm:flex-row items-center gap-6 relative z-10 shadow-inner">
                            <div class="w-20 h-20 bg-gradient-to-br from-yellow-300 to-orange-500 text-white rounded-3xl flex items-center justify-center shadow-[0_10px_30px_rgba(245,158,11,0.5)] border-2 border-white/30 transform -rotate-6"><i class="ph-fill ph-gift text-4xl"></i></div>
                            <div class="flex-1 w-full text-center sm:text-left">
                                <div class="text-[11px] text-indigo-200 font-bold uppercase tracking-widest mb-2">BƯỚC 1: CHỌN NGƯỜI ĐỔI QUÀ</div>
                                <select onchange="selectStudentForRewards(parseInt(this.value))" class="w-full text-xl md:text-2xl font-black text-white bg-transparent focus:outline-none cursor-pointer border-b-2 border-white/30 pb-3 focus:border-white transition-colors">
                                    <option value="" class="text-slate-800">-- Nhấp để chọn học sinh --</option>
                                    ${state.students.map(s => `<option value="${s.id}" class="text-slate-800" ${s.id === selectedStudentId ? 'selected' : ''}>${s.name} (${s.stars} sao)</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="bg-white p-6 md:p-8 rounded-[1.5rem] shadow-2xl w-full lg:w-auto flex items-center justify-center gap-10 relative z-10 min-w-[320px]">
                            <div class="text-center"><div class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-1">TỔNG ĐIỂM</div><div class="text-3xl font-black text-slate-800">${student ? student.points : '0'}</div></div>
                            <div class="w-px h-16 bg-slate-200"></div>
                            <div class="text-center"><div class="text-[11px] text-orange-500 font-bold uppercase tracking-widest mb-1">SAO HIỆN CÓ</div><div class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center gap-2">${student ? (student.stars || 0) : '0'} <i class="ph-fill ph-star text-accent text-3xl animate-spin-slow"></i></div></div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200 relative">
                        <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2"><i class="ph-bold ph-users text-lg"></i> Chọn nhanh học sinh (Sắp xếp theo sao)</div>
                        <div class="flex overflow-x-auto gap-4 pb-4 px-2 pt-2 custom-scrollbar">${studentListHtml || '<div class="text-slate-400 italic text-sm">Chưa có học sinh</div>'}</div>
                    </div>
                    
                    <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-8 mb-4 flex items-center gap-2"><i class="ph-bold ph-storefront text-lg"></i> Danh mục quà tặng</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6 xl:gap-8">${catalogHtml}</div>
                </div>
            `;
        }

        function executeRedeem(studentId, itemId) {
            const student = state.students.find(s => s.id === parseInt(studentId));
            const item = state.rewards.find(i => i.id === itemId);
            if (student && item && (student.stars || 0) >= item.cost) {
                if(confirm(`Đổi "${item.name}" cho ${student.name} với giá ${item.cost} sao?\nSau khi đổi, sao sẽ bị trừ nhưng tổng điểm không đổi.`)) {
                    student.stars -= item.cost; saveData(); renderLayout(); showToast(`Đã đổi quà thành công!`); triggerConfetti();
                }
            }
        }

        function renderViewNhomThiDua() {
            const groupsWithStats = state.groups.map(g => {
                const members = state.students.filter(s => s.group === g.name);
                const totalPoints = members.reduce((sum, s) => sum + (s.points || 0), 0);
                return { ...g, members, totalPoints };
            }).sort((a, b) => b.totalPoints - a.totalPoints);
            
            const maxGroupPoints = Math.max(...groupsWithStats.map(g => g.totalPoints), 1);

            const groupCardsHtml = groupsWithStats.map((g, index) => {
                let wrapperClass = 'border border-slate-200 hover:border-blue-300 shadow-sm hover:shadow-xl hover:-translate-y-2';
                let innerClass = 'bg-white rounded-[2rem]';
                let rankBadge = '';
                let pointColor = 'bg-slate-50 text-slate-700 border border-slate-200';
                let bgHeader = 'bg-transparent';
                let progressColor = 'from-blue-400 to-blueAccent';

                if (index === 0 && g.totalPoints > 0) {
                    wrapperClass = 'p-1.5 bg-gradient-to-br from-[#fde047] via-[#f59e0b] to-[#d97706] shadow-[0_10px_30px_rgba(245,158,11,0.25)] hover:-translate-y-3 border-none transform md:scale-[1.02] z-10';
                    rankBadge = `<div class="absolute -top-5 -left-5 w-14 h-14 bg-gradient-to-br from-[#fde047] to-[#f59e0b] rounded-full text-white font-black text-2xl shadow-lg flex items-center justify-center z-20 border-4 border-white"><i class="ph-fill ph-crown text-3xl absolute -top-5 text-yellow-300 drop-shadow-md"></i>1</div>`;
                    pointColor = 'bg-gradient-to-r from-orange-400 to-red-500 text-white shadow-md border border-red-400/50';
                    bgHeader = 'bg-gradient-to-b from-yellow-50 to-transparent';
                    progressColor = 'from-yellow-400 to-orange-500';
                    innerClass = 'bg-white rounded-[1.6rem]';
                }

                const sortedMembers = [...g.members].sort((a,b) => (b.points || 0) - (a.points || 0));
                let membersListHtml = sortedMembers.map((m, i) => `
                    <div class="flex items-center gap-3.5 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all cursor-pointer group/member mb-2" onclick="switchTab('tich-diem'); selectStudentForPoints(${m.id})">
                        <div class="text-[10px] font-bold text-slate-300 w-3 text-center">${i+1}</div>
                        ${getAvatarImg(m.avatarUrl, m.name, "w-10 h-10 flex-shrink-0 group-hover/member:scale-110 transition-transform")}
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold text-slate-800 truncate mb-0.5">${m.name}</div>
                            <div class="text-[9px] text-slate-400 font-bold uppercase tracking-wider truncate">${m.role || 'Thành viên'}</div>
                        </div>
                        <div class="text-sm font-bold ${m.points > 0 ? 'text-blueAccent' : 'text-slate-400'} bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-100">${m.points || 0}</div>
                    </div>
                `).join('');

                if (sortedMembers.length === 0) membersListHtml = `<div class="text-xs text-slate-400 font-medium italic text-center py-10 bg-slate-50/50 rounded-2xl border border-dashed border-slate-200">Chưa có thành viên nào</div>`;
                const progressPercent = maxGroupPoints > 0 ? (g.totalPoints / maxGroupPoints) * 100 : 0;

                return `
                    <div class="rounded-[2rem] bg-white relative group h-full transition-all duration-300 ${wrapperClass} flex flex-col">
                        ${rankBadge}
                        <div class="${innerClass} h-full flex flex-col overflow-hidden relative z-10 flex-1">
                            <div class="p-6 pb-5 ${bgHeader} relative border-b border-slate-100">
                                <div class="flex justify-between items-start mb-5">
                                    <div class="flex items-center gap-4 pr-2">
                                        ${g.avatarUrl ? `<img src="${g.avatarUrl}" class="w-16 h-16 rounded-2xl object-cover shadow-sm ring-4 ring-white">` : `<div class="w-16 h-16 rounded-2xl bg-white flex items-center justify-center shadow-sm ring-4 ring-slate-50 border border-slate-100"><i class="ph-fill ph-users-three text-3xl ${g.color}"></i></div>`}
                                        <div>
                                            <h3 class="font-black text-slate-800 text-xl tracking-tight leading-none mb-2">${g.name}</h3>
                                            <div class="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded inline-block"><i class="ph-fill ph-users"></i> ${g.members.length} Thành viên</div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end flex-shrink-0">
                                        <div class="px-4 py-2.5 rounded-xl ${pointColor} flex items-center gap-1.5">
                                            <span class="font-black text-2xl leading-none">${g.totalPoints}</span>
                                            <i class="ph-fill ph-star text-base ${index === 0 ? 'text-yellow-200 animate-pulse' : ''}"></i>
                                        </div>
                                    </div>
                                </div>
                                <div class="absolute top-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-lg z-20 border border-slate-100">
                                    <button onclick="pickRandomInGroup('${g.id}')" title="Quay random trong nhóm" class="text-slate-500 hover:text-purple-600 p-2 rounded-lg bg-slate-50 hover:bg-purple-50 transition-colors"><i class="ph-fill ph-dice-three text-lg"></i></button>
                                    <button onclick="openEditGroupModal('${g.id}')" title="Sửa nhóm" class="text-slate-500 hover:text-blueAccent p-2 rounded-lg bg-slate-50 hover:bg-blue-50 transition-colors"><i class="ph-fill ph-pencil-simple text-lg"></i></button>
                                    <button onclick="deleteGroup('${g.id}')" title="Xóa nhóm" class="text-slate-500 hover:text-red-500 p-2 rounded-lg bg-slate-50 hover:bg-red-50 transition-colors"><i class="ph-fill ph-trash text-lg"></i></button>
                                </div>
                                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden shadow-inner relative">
                                    <div class="absolute top-0 left-0 h-full bg-gradient-to-r ${progressColor} rounded-full transition-all duration-1000 ease-out" style="width: ${progressPercent}%"></div>
                                </div>
                            </div>
                            <div class="p-5 bg-slate-50/50 flex-1 flex flex-col overflow-y-auto custom-scrollbar" style="max-height: 320px;">${membersListHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="max-w-7xl mx-auto animate-fade-in space-y-8 pb-12">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                        <div>

        function markAttendance(id, status) {

        }

        function changeAttendanceDate(d) { if(d) { currentAttendanceDate = d; renderLayout(); } }

        let wheelRotation = 0, isSpinning = false, wheelItems = [], wheelMode = 'student';
        const wheelColors = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef', '#ec4899'];

                            <button onclick="wheelMode='group'; renderLayout();" class="px-6 py-3 rounded-xl text-sm font-bold transition-all ${wheelMode === 'group' ? 'bg-blue-50 text-blueAccent shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}">Tổ</button>
                        </div>
                    </div>
                    
                    <div class="flex flex-col xl:flex-row items-center justify-center gap-12 xl:gap-20 w-full max-w-6xl">
                        <div class="relative flex flex-col items-center group">

                            <div class="absolute -top-6 z-20 w-0 h-0 border-l-[24px] border-l-transparent border-r-[24px] border-r-transparent border-t-[40px] border-t-slate-800 drop-shadow-xl filter pb-2"></div>
                            
                            <!-- Wheel Container -->
                            <div class="w-[320px] h-[320px] md:w-[450px] md:h-[450px] rounded-full border-[16px] border-white shadow-[0_20px_50px_rgba(0,0,0,0.15)] relative overflow-hidden bg-slate-100 ring-8 ring-slate-200/50">
                                <div class="absolute inset-0 rounded-full border-4 border-black/10 z-10 pointer-events-none"></div>
                                <canvas id="wheelCanvas" width="418" height="418" class="w-full h-full origin-center"></canvas>
                                <!-- Center Dot -->
                                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full shadow-lg border-4 border-slate-200 z-10 flex items-center justify-center">
                                    <div class="w-4 h-4 bg-slate-800 rounded-full"></div>

                        <div class="bg-white rounded-[2rem] p-10 shadow-xl border border-slate-200 w-full max-w-md min-h-[450px] flex flex-col items-center justify-center text-center relative overflow-hidden">

        function setupWheel() {
            const canvas = document.getElementById('wheelCanvas'); if (!canvas) return; const ctx = canvas.getContext('2d');
            wheelItems = wheelMode === 'student' ? [...state.students] : [...state.groups]; 
            if (wheelItems.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#94a3b8'; ctx.font = "600 20px Montserrat"; ctx.textAlign = "center";
                ctx.fillText("Chưa có dữ liệu", canvas.width/2, canvas.height/2);
                return;
            }
            
            const r = canvas.width / 2; const arc = Math.PI * 2 / wheelItems.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.save(); ctx.translate(r, r); ctx.rotate(wheelRotation * Math.PI / 180);
            
            wheelItems.forEach((item, i) => {
                // Draw slice
                ctx.beginPath(); 
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.moveTo(0, 0); ctx.arc(0, 0, r, i*arc, (i+1)*arc); ctx.fill(); 
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
                
                // Draw Text
                ctx.save(); 
                ctx.rotate(i*arc + arc/2); 
                ctx.textAlign = "right"; ctx.textBaseline = "middle";
                ctx.fillStyle = "#fff"; 
                ctx.font = "900 18px Montserrat"; 
                ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 8;
                const text = item.name.length > 15 ? item.name.substring(0,12)+'...' : item.name;
                ctx.fillText(text, r - 30, 0); 
                ctx.restore();
            }); 
            ctx.restore();
        }

        function spinWheel() {
            if (isSpinning || wheelItems.length === 0) return; isSpinning = true;
            document.getElementById('wheel-result-content').innerHTML = `<i class="ph-bold ph-arrows-clockwise text-6xl text-primary mb-6 animate-spin"></i><div class="text-xl font-bold text-primary">Đang quay...</div>`;
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 } }).toDestination(); clickSynth.volume.value = -10; } catch(e) {}

            const duration = 4500, extraRots = 360 * (6 + Math.random() * 4), targetRot = wheelRotation + extraRots, start = performance.now();
            function animate(time) {
                let t = (time - start) / duration; if (t > 1) t = 1;
                const easeT = 1 - (--t)*t*t*t; const currentRot = wheelRotation + (targetRot - wheelRotation) * easeT;
                const arcDeg = 360 / wheelItems.length;
                if (Math.floor(currentRot / arcDeg) > Math.floor(wheelRotation / arcDeg) && clickSynth) {
                    try { clickSynth.triggerAttackRelease("G5", "32n", Tone.now()); } catch (err) {}
                }
                wheelRotation = currentRot; setupWheel();
                if (t < 0) requestAnimationFrame(animate); else { isSpinning = false; determineWinner(); }
            } requestAnimationFrame(animate);
        }
        function determineWinner() {
            const arcDeg = 360 / wheelItems.length; 
            // The pointer is at top (270 degrees in canvas coords, but we rotated the context).
            // Adjust calculation based on standard top pointer.
            const point = (270 - (wheelRotation%360) + 360) % 360;
            const w = wheelItems[Math.floor(point / arcDeg)];

        function saveStudentEdit() {
            const name = document.getElementById('edit-s-name').value.trim();
            if(!name) return showToast('Vui lòng nhập tên học sinh!', 'error');

            const sData = {
                name: name, gender: document.getElementById('edit-s-gender').value, group: document.getElementById('edit-s-group').value,
                role: document.getElementById('edit-s-role').value.trim(), goal: document.getElementById('edit-s-goal').value.trim(),
                avatarUrl: document.getElementById('edit-s-avatar').value.trim()
            };

            if (state.editingStudentId) {
                const index = state.students.findIndex(s => s.id === state.editingStudentId);
                if (index > -1) state.students[index] = { ...state.students[index], ...sData };
            } else {
                const newId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
                state.students.push({ id: newId, points: 0, stars: 0, code: generateUniqueCode(), history: [], ...sData });
            }
            saveData(); closeModal('edit-student-modal'); renderLayout(); showToast("Đã lưu thông tin học sinh!");
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas'); if (!canvas) return; const container = document.getElementById('main-container');
            canvas.width = container.offsetWidth; canvas.height = container.offsetHeight; const ctx = canvas.getContext('2d');
            const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+2, dx: Math.random()*16-8, dy: Math.random()*-15-5, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                particles.forEach(p => { if (p.y < canvas.height) active++; p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.2; ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke(); });
                if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
            } render();
        }

        function renderDrawerTimerText() {

            if (display) {
                const span = display.querySelector('span');
                const m = Math.floor(timerSeconds / 60), s = timerSeconds % 60; span.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        function updateTimerFromInputs() {
            if (isTimerRunning) return; 
            let m = parseInt(document.getElementById('drawer-min-input').value)||0, s = parseInt(document.getElementById('drawer-sec-input').value)||0;
            if (s > 59) { m += Math.floor(s / 60); s = s % 60; } if (m > 99) m = 99;
            document.getElementById('drawer-min-input').value = m; document.getElementById('drawer-sec-input').value = s;

        function toggleDrawerTimer() {
            const startBtn = document.getElementById('drawer-start-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Tiếp Tục";
            } else {
                if (timerSeconds <= 0) updateTimerFromInputs(); if (timerSeconds <= 0) return;
                isTimerRunning = true; startBtn.innerText = "Tạm Dừng";
                if (Tone.context.state !== 'running') Tone.start();
                let tickSynth = null;
                try { tickSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); tickSynth.volume.value = -15; } catch(e) {}
                timerInterval = setInterval(() => {
                    timerSeconds--; renderDrawerTimerText();
                    if (tickSynth && Tone.context.state === 'running') {
                        if (timerSeconds <= 10 && timerSeconds > 0) tickSynth.triggerAttackRelease("E5", "8n");
                        else if (timerSeconds > 10) tickSynth.triggerAttackRelease("C5", "16n");
                    }
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Bắt Đầu"; showToast("Hết giờ!", "success");
                        try{ const s = new Tone.PolySynth().toDestination(); s.triggerAttackRelease(['C4','E4','G4'], "1n"); }catch(e){}
                    }
                }, 1000);
            }
        }

                    role: (row[3] || '').toString().trim() || '',

                    talent: (row[5] || '').toString().trim() || '',

                { val: 'from-fuchsia-600 to-purple-900', label: 'Ảo diệu' }, 
                { val: 'from-rose-400 to-pink-600', label: 'Ngọt ngào' }, 
                { val: 'from-cyan-400 to-blue-600', label: 'Bầu trời' } 
            ];

            const colorBtnsHtml = colors.map(c => `
                <button onclick="document.getElementById('edit-theme-color').value='${c.val}'; document.querySelectorAll('.banner-color-btn').forEach(b => b.classList.remove('ring-4', 'ring-white', 'shadow-lg', 'scale-110')); this.classList.add('ring-4', 'ring-white', 'shadow-lg', 'scale-110');" 
                        class="h-12 rounded-xl bg-gradient-to-br ${c.val} shadow-sm transition-all banner-color-btn ${currentColor === c.val ? 'ring-4 ring-white shadow-lg scale-110' : 'hover:scale-105 border border-slate-200'}"></button>
            `).join('');

            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="edit-theme-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-primary text-white p-6 flex justify-between items-center px-8 relative"><h3 class="font-black text-xl flex items-center gap-2 relative z-10"><i class="ph-fill ph-image text-accent"></i> GIAO DIỆN CHUNG</h3><button onclick="closeModal('edit-theme-modal')" class="bg-white/10 p-2.5 rounded-full hover:bg-white/20 transition-colors relative z-10"><i class="ph-bold ph-x text-lg"></i></button></div>
                        <div class="p-8 space-y-6 bg-slate-50 overflow-y-auto custom-scrollbar flex-1">
                            <div><label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Tiêu đề phụ (VD: Chủ điểm tháng)</label><input type="text" id="edit-theme-month" value="${escapeHtmlAttr(state.theme.month || '')}" class="w-full px-5 py-3.5 bg-white border border-slate-300 rounded-xl focus:border-blueAccent focus:ring-4 focus:ring-blue-100 font-bold transition-all text-sm outline-none"></div>
                            <div><label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Tiêu đề chính Banner</label><input type="text" id="edit-theme-title" value="${escapeHtmlAttr(state.theme.title || '')}" class="w-full px-5 py-3.5 bg-white border border-slate-300 rounded-xl focus:border-blueAccent focus:ring-4 focus:ring-blue-100 font-black text-slate-800 transition-all text-base outline-none"></div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-3 uppercase tracking-widest">Giao diện Màu nền</label>
                                <div class="grid grid-cols-4 sm:grid-cols-7 gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">${colorBtnsHtml}</div>
                                <input type="hidden" id="edit-theme-color" value="${currentColor}">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-3 uppercase tracking-widest">Hoặc dùng Ảnh nền (Tùy chọn)</label>
                                <div class="relative cursor-pointer group mb-2" onclick="document.getElementById('edit-theme-banner-upload').click()">
                                    <div id="banner-preview-container" class="w-full h-36 rounded-2xl bg-slate-100 flex items-center justify-center shadow-inner overflow-hidden border-2 border-dashed border-slate-300 group-hover:border-blueAccent transition-colors relative">
                                        ${state.theme.bannerUrl ? `<img src="${state.theme.bannerUrl}" class="w-full h-full object-cover">` : `<div class="flex flex-col items-center gap-2"><i class="ph-fill ph-image text-4xl text-slate-300"></i><span class="text-xs font-bold text-slate-400">Bấm để chọn ảnh</span></div>`}
                                    </div>
                                    <input type="file" id="edit-theme-banner-upload" class="hidden" accept="image/*" onchange="handleBannerUpload(event)">
                                </div>
                                <input type="text" id="edit-theme-banner" value="${escapeHtmlAttr(state.theme.bannerUrl || '')}" class="hidden">
                                ${state.theme.bannerUrl ? `<button onclick="document.getElementById('edit-theme-banner').value=''; document.getElementById('banner-preview-container').innerHTML='<div class=\\'flex flex-col items-center gap-2\\'><i class=\\'ph-fill ph-image text-4xl text-slate-300\\'></i><span class=\\'text-xs font-bold text-slate-400\\'>Bấm để chọn ảnh</span></div>'; this.style.display='none';" class="text-[11px] text-red-500 font-bold bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">Xóa ảnh và dùng màu nền</button>` : ''}
                            </div>
                        </div>
                        <div class="p-6 bg-white border-t border-slate-200"><button onclick="saveThemeEdit()" class="w-full py-4 bg-primary text-white font-black rounded-xl hover:bg-secondary shadow-lg hover:-translate-y-0.5 transition-all tracking-wide">CẬP NHẬT GIAO DIỆN</button></div>
                    </div>
                </div>
            `;
        }

        function handleBannerUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            compressImage(file, (dataUrl) => {
                document.getElementById('edit-theme-banner').value = dataUrl;
                const preview = document.getElementById('banner-preview-container');
                if (preview) preview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-2xl"><div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-bold ph-upload-simple text-white text-3xl mb-2"></i><span class="text-white text-sm font-bold">Thay ảnh khác</span></div>`;
            }, 1200, 0.8);
        }

        function saveThemeEdit() {
            state.theme.month = document.getElementById('edit-theme-month').value.trim();
            state.theme.title = document.getElementById('edit-theme-title').value.trim();
            state.theme.bannerUrl = document.getElementById('edit-theme-banner').value.trim();
            state.theme.bannerColorClass = document.getElementById('edit-theme-color').value.trim();
            saveData(); closeModal('edit-theme-modal'); renderLayout(); showToast("Đã cập nhật giao diện tổng quan!");
        }

        /* --- TÍNH NĂNG XEM LỊCH SỬ HỌC SINH --- */
        window.openStudentHistoryModal = function(id) {
            const student = state.students.find(s => s.id === id);
            if (!student) return;

            const history = student.history || [];
            // Sắp xếp lịch sử mới nhất lên đầu
            const sortedHistory = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));

            let historyHtml = '';
            if (sortedHistory.length === 0) {
                historyHtml = `
                    <div class="text-center py-12 flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-3xl bg-white/50">
                        <i class="ph-fill ph-clock-dashed text-6xl text-slate-300 mb-3"></i>
                        <div class="text-slate-500 font-bold text-lg">Chưa có dữ liệu</div>
                        <p class="text-sm text-slate-400 mt-1">Học sinh chưa có lịch sử cộng/trừ điểm nào.</p>
                    </div>`;
            } else {
                historyHtml = sortedHistory.map(h => {
                    const dateObj = new Date(h.date);
                    const dateStr = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                    const timeStr = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                    const isPositive = h.points > 0;
                    
                    const colorTheme = isPositive 
                        ? { bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', icon: 'ph-trend-up', sign: '+' } 
                        : { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-200', icon: 'ph-trend-down', sign: '' };

                    return `
                        <div class="flex gap-5 items-start relative pb-6 group">
                            <!-- Đường viền dọc nối các sự kiện -->
                            <div class="absolute top-10 left-[23px] bottom-0 w-[2px] bg-slate-200 group-last:bg-transparent"></div>
                            
                            <!-- Icon -->
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 z-10 shadow-sm border ${colorTheme.border} ${colorTheme.bg} ${colorTheme.text}">
                                <i class="ph-bold ${colorTheme.icon} text-xl"></i>
                            </div>
                            
                            <!-- Nội dung -->
                            <div class="flex-1 bg-white p-4 md:p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all hover:-translate-y-1">
                                <div class="flex justify-between items-start gap-4 mb-2">
                                    <div class="font-bold text-slate-800 text-base leading-tight">${h.reason}</div>
                                    <div class="font-black text-xl flex-shrink-0 ${colorTheme.text} bg-white px-2 py-0.5 rounded-lg border ${colorTheme.border} shadow-sm">${colorTheme.sign}${h.points}</div>
                                </div>
                                <div class="text-[11px] font-bold text-slate-400 flex items-center gap-1.5 uppercase tracking-wider">
                                    <i class="ph-fill ph-clock"></i> ${timeStr} <span class="mx-1">•</span> <i class="ph-fill ph-calendar-blank"></i> ${dateStr}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const modalHtml = `
                <div class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="history-student-modal">
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-primary text-white p-6 flex justify-between items-center px-8 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                            <h3 class="font-black text-xl flex items-center gap-3 relative z-10"><i class="ph-fill ph-clock-counter-clockwise text-accent text-2xl"></i> LỊCH SỬ THI ĐUA</h3>
                            <button onclick="closeModal('history-student-modal')" class="text-white hover:text-red-400 bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-colors relative z-10"><i class="ph-bold ph-x text-lg"></i></button>
                        </div>
                        
                        <!-- Header / Profile -->
                        <div class="px-8 py-6 border-b border-slate-200 bg-white flex items-center justify-between gap-4 shadow-sm z-10 relative">
                            <div class="flex items-center gap-5">
                                ${getAvatarImg(student.avatarUrl, student.name, "w-16 h-16 ring-4 ring-slate-50 shadow-md")}
                                <div>
                                    <div class="font-black text-slate-800 text-2xl tracking-tight mb-1">${student.name}</div>
                                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-lg inline-block border border-slate-200">${student.group}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">TỔNG ĐIỂM HIỆN TẠI</div>
                                <div class="text-3xl font-black text-blueAccent">${student.points}</div>
                            </div>
                        </div>

                        <!-- Timeline -->
                        <div class="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar bg-slate-50 relative">
                            ${historyHtml}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        };
    </script>
</body>
</html>
